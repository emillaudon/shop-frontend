<div class="login-page">
  <div class="login-component">
    <div class="login__top">
      <h1>Welcome Back</h1>
      <h3>Please sign in</h3>
    </div>
    <div class="login__bottom">
      <form #loginForm="ngForm" class="login-form" (ngSubmit)="onSubmit()">
        <div class="userinfo-input">
          <input
            type="email"
            placeholder="Email"
            name="email"
            aria-label="Email"
            [(ngModel)]="email"
          />
          <input
            type="password"
            placeholder="Password"
            name="password"
            aria-label="Password"
            [(ngModel)]="password"
          />
        </div>
        <a class="forgot-password-button">
          <p>Forgot Password?</p>
        </a>
        <button
          class="signin-button"
          type="submit"
          [disabled]="loginForm.invalid"
        >
          Sign In
        </button>
      </form>
      <a
        class="signup-button"
        routerLink="/register"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        <p>Don't have an account?</p>
        <p class="signup-text">Sign Up</p>
      </a>
    </div>
  </div>
</div>
