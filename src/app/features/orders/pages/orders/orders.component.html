<section class="orders-page">
    <div class="orders-column">
        @if ((orders$ | async)?.length === 0) {
            <p>No Orders Found</p>
        }
        @for (o of (orders$ | async); track $index) {
            <app-order-card
            [order]="o"
            ></app-order-card>
        }
    </div>
</section>
