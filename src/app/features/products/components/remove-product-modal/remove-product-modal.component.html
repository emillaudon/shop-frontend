<button class="modal-backdrop" (click)="onBackDropClicked($event)">
  <div class="modal">
    <h2>Delete Product</h2>
    <h3>{{ product }}</h3>
    <div class="modal__footer">
      <button (click)="onClickYes()">Yes</button>
      <button (click)="onClickCancel()">No</button>
    </div>
  </div>
</button>
