<section class="products-page">
    <div class="products-grid">
        @if(vm$ | async; as vm) {
            @if(vm.loading) {
                <p>Loading...</p>
            }
            @if(vm.error) {
                <p>{{ vm.error.message }}</p>
                <button (click)="reload()">Retry</button>
            }
            @if (!vm.loading && !vm.error && (vm.data?.length === 0)) {
                <p>No Products Found</p>
            }
            @for (p of (vm.data ?? []); track p.id) {
                <app-product-card
                    [product]="p"
                    (addToCart)="onAddToCart(p)">
                </app-product-card>
            }
        }
    </div>

    @if ((cartOpen$ | async)) {
        <aside #panel class="cart-panel">  
        <app-cart-panel></app-cart-panel>
        </aside>
    }
</section>
