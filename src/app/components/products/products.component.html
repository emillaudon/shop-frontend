<section class="products-page">
    <div class="products-grid" *ngIf="products$ | async as products">
        <app-product-card *ngFor="let p of products; trackBy: trackById"
        [product]="p"
        (addToCart)="onAddToCart($event)">
        </app-product-card>
    </div>

    <aside #panel class="cart-panel"
    *ngIf="cartOpen$ | async">  
    <app-cart-panel></app-cart-panel>
    </aside>
</section>
